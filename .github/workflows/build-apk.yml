name: Build GrowthPilot Universal V4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack GrowthPilot Universal V4
        shell: bash
        run: |
          set -e

          echo "===== Repository files ====="
          ls -lah

          if [ ! -f "GrowthPilotUniversalV4.zip" ]; then
            echo "ERROR: GrowthPilotUniversalV4.zip not found."
            exit 1
          fi

          rm -rf project
          mkdir project

          unzip -q GrowthPilotUniversalV4.zip -d project

          echo "===== Project files ====="
          find project -maxdepth 3 -type f | sort | head -100

          if [ ! -f "project/settings.gradle" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "project/build.gradle" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          if [ ! -f "project/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "GrowthPilot Universal V4 project detected successfully."

      - name: Build GrowthPilot Universal V4 APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK_FILE="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find project/app/build -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$APK_FILE" GrowthPilot-Universal-V4-Beta.apk

          echo "===== APK ====="
          ls -lh GrowthPilot-Universal-V4-Beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrowthPilot-Universal-V4-Beta-APK
          path: GrowthPilot-Universal-V4-Beta.apk
          retention-days: 30
